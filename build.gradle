plugins {
    id 'java'
    id 'maven-publish'

    id 'com.matthewprenger.cursegradle' version '1.4.0'
    id 'com.modrinth.minotaur' version "2.+"

    id 'net.neoforged.moddev' version '2.0.148'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(java_version.toInteger())
    }
    withSourcesJar()
    // withJavadocJar()
}

sourceSets.main.resources.srcDirs += "src/main/generated"

group = 'com.teamcofh'
base {
    archivesName = "${mod_id}"
}

def buildVersion = "${mod_version}." + (System.getenv("BUILD_NUMBER") ?: '0')
version = "${mc_version}-${buildVersion}"
println "Starting build of ${base.archivesName.get()}, Version: ${mod_version}"
println "Using NeoForge: ${neo_version}, for Minecraft: ${mc_version}"

def arsenalTestWithThermal = providers.gradleProperty('arsenalTestWithThermal').isPresent()
def arsenalTestFolder = arsenalTestWithThermal ? 'with-thermal' : 'standalone'

neoForge {
    version = neo_version
    addModdingDependenciesTo(sourceSets.test)
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all', '--output',
                    file('src/main/generated').absolutePath, '--existing',
                    file('src/main/resources').absolutePath
        }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
        redstone_arsenal_tests { sourceSet(sourceSets.test) }
    }
    runs.configureEach {
        loadedMods.set([mods.named(mod_id).get()])
    }
    runs.create('arsenalTests') {
        type = 'gameTestServer'
        sourceSet = sourceSets.test
        loadedMods.set([mods.named('redstone_arsenal_tests').get()])
        gameDirectory = layout.buildDirectory.dir("arsenal-tests/${project.version}/${arsenalTestFolder}")
        systemProperty 'neoforge.enabledGameTestNamespaces', 'redstone_arsenal_tests'
        disableIdeRun()
    }
}

if (System.getenv('CURSEFORGE_KEY') || project.hasProperty('curseforgeKey')) {
    println "Enabling CurseForge config."
    tasks.named('curseforge').configure { dependsOn(jar) }

    curseforge {
        apiKey = System.getenv("CURSEFORGE_KEY") ?: project.findProperty("curseforgeKey")

        project {
            id = '70631'
            changelogType = 'markdown'
            changelog = "[Changelog on GitHub - ${version}](https://raw.githubusercontent.com/cofh/version/main/${mod_id}/changelog.md)"
            releaseType = "${release_type}"
            mainArtifact(jar)
            addGameVersion "Java ${java_version}"
            addGameVersion "${mc_version}"
        }
    }
}

if (System.getenv('MODRINTH_TOKEN') || project.hasProperty('modrinthToken')) {
    println "Enabling Modrinth config."
    tasks.named('modrinth').configure { dependsOn(jar) }

    modrinth {
        token = System.getenv("MODRINTH_TOKEN") ?: project.findProperty("modrinthToken")
        projectId = 'KfkTLdPl'
        versionNumber = "${mod_version}"
        versionType = "${release_type}"
        changelog = "[Changelog on GitHub - ${version}](https://raw.githubusercontent.com/cofh/version/main/${mod_id}/changelog.md)"
        uploadFile = jar
        gameVersions = ["${mc_version}"]
    }
}

processResources {
    def metadata = [mod_version: mod_version, mc_version: mc_version, neo_version: neo_version,
                    cofh_core_version_range: "[${cofh_core_version},${cofh_core_max_version})"]
    inputs.properties metadata
    filesMatching('META-INF/neoforge.mods.toml') {
        expand metadata
    }
}

repositories {
    mavenCentral()
    mavenLocal()
    maven { url 'https://maven.covers1624.net/' }
    maven { url 'https://maven.blamejared.com/' }
}

dependencies {
    def cofhCoreJar = providers.gradleProperty('cofhCoreJar').getOrElse("../../Output/cofh_core-${mc_version}-${cofh_core_version}.1.jar")
    implementation files(cofhCoreJar)
}

def stageArsenalTestJar = tasks.register('stageArsenalTestJar', Sync) {
    from(tasks.named('jar', Jar).flatMap { it.archiveFile })
    if (arsenalTestWithThermal) {
        from('../../Output/thermal_core-1.21.1-11.0.7.4.jar', '../../Output/thermal_foundation-1.21.1-11.0.7.1.jar')
    }
    into(layout.buildDirectory.dir("arsenal-tests/${project.version}/${arsenalTestFolder}/mods"))
}

tasks.named('runArsenalTests') {
    dependsOn(stageArsenalTestJar)
}

def commonManifest = {
    attributes([
            'Specification-Title'     : "${mod_name}",
            'Specification-Vendor'    : 'Team CoFH',
            'Specification-Version'   : "${mc_version}",
            'Implementation-Title'    : "${mod_id}",
            'Implementation-Vendor'   : 'Team CoFH',
            'Implementation-Version'  : "${mod_version}",
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
    ])
}

tasks.register("signJar") {
    dependsOn("jar")

    doFirst {
        def args = [:]
        args['jar'] = jar.archiveFile.get().asFile
        if (System.getenv("KEY_STORE")) {
            args['keyStore'] = System.getenv("KEY_STORE")
            file(System.getenv("KEY_STORE_PROPS")).withReader {
                def props = new Properties()
                props.load(it)
                args.addAll(props)
            }
        } else if (project.hasProperty('keyStore')) {
            args['keyStore'] = project.getProperty('keyStore')
            args['alias'] = project.getProperty('keyStoreAlias')
            args['storePass'] = project.getProperty('keyStorePass')
            args['keyPass'] = project.getProperty('keyStoreKeyPass')
        } else {
            println "No signing properties."
            state.setOutcome(org.gradle.api.internal.tasks.TaskExecutionOutcome.UP_TO_DATE)
            didWork = false
            return
        }
        project.ant.invokeMethod('signjar', args)
    }
}

publishing {
    repositories {
        if (System.getenv('MAVEN_PASS')) {
            maven {
                url 'https://nexus.covers1624.net/repository/cofh-releases/'
                credentials {
                    username 'kinglemming'
                    password System.getenv('MAVEN_PASS')
                }
            }
        }
    }
    publications {
        mod(MavenPublication) {
            groupId project.group
            artifactId project.archivesBaseName
            version project.version
            artifact jar
            artifact sourcesJar

            pom {
                name = archivesBaseName
                description = archivesBaseName
                url = "https://github.com/CoFH/${project.name}"
                scm {
                    url = "https://github.com/CoFH/${project.name}"
                    connection = "scm:git:git://github.com/CoFH/${project.name}.git"
                    connection = "scm:git:git@github.com:CoFH/${project.name}.git"
                }

                issueManagement {
                    system = 'discord'
                    url = 'https://discord.gg/uRKrnbH'
                }
                licenses {
                    license {
                        name = 'Don\'t Be a Jerk v2'
                        url = "https://github.com/CoFH/${project.name}/blob/main/README.md"
                        distribution = 'repo'
                    }
                }
                developers {
                    developer {
                        id = 'teamcofh'
                        name = 'Team CoFH'
                    }
                }
            }
        }
    }
}
